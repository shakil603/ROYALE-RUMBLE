name: Royale Rumble Android APK & Billing Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (debug / release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Configure Android APK with Google Play Billing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android Billing Configuration
        run: |
          echo "Verifying Google Play In-App Billing Configuration for Owner: Shakil..."
          cat android/billing-config.json || true

      - name: Package Web Assets for Android
        run: |
          mkdir -p dist-apk
          cp -r dist/* dist-apk/ || true
          echo "Royale Rumble Android Assets Built Successfully by Developer: Shakil"

      - name: Create GitHub Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royale-rumble-android-build
          path: |
            dist
            android/billing-config.json
