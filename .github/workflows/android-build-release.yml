name: Royale Rumble Android APK & Billing Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (debug / release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Configure Android APK with Google Play Billing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "Configuring preinstalled Android SDK environment..."
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Verify Android Billing Configuration
        run: |
          echo "Verifying Google Play In-App Billing Configuration for Owner: Shakil..."
          cat android/billing-config.json

      - name: Package Web & Android Release Assets
        run: |
          mkdir -p release-bundle/android
          cp -r dist release-bundle/web-app
          cp -r android/* release-bundle/android/
          echo "Royale Rumble Android & Billing Bundle successfully generated for Developer: Shakil"

      - name: Upload Royale Rumble Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: royale-rumble-android-release
          path: release-bundle/
