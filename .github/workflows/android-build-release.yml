name: Build Royale Rumble Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK File (Shakil Edition)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Copy Web Dist Assets into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          echo "Web game assets embedded into Android APK assets directory."

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Files for Download
        run: |
          mkdir -p apk-output
          # Copy debug APK (Directly installable on any Android device without signing key issues)
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/RoyaleRumble-Shakil-Debug.apk
          fi
          # Copy release APK
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/RoyaleRumble-Shakil-Release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/RoyaleRumble-Shakil-Release.apk
          fi
          ls -lh apk-output/

      - name: Upload APK Files (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: RoyaleRumble-APK-Files
          path: apk-output/*.apk
          if-no-files-found: warn
